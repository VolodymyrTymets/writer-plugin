schema_version: "1.1"
name: brief-actor-sqlite-wal
description: "The brief stage normalises the sqlite-wal brief without a question and saves a G0 PASS"
tags: [actor, g0]
runs: 1
execution:
  prompt: "/writer-plugin:brief sqlite-wal input/sqlite-wal.md"
  max_turns: 40
  timeout_seconds: 1200
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: brief-written
    type: file_exists
    path: "articles/sqlite-wal/brief.md"
  - name: no-placeholder-left
    type: regex
    target:
      source: "file"
      path: "articles/sqlite-wal/brief.md"
    pattern: "\\{\\{"
    match: "not_contains"
  - name: verdict-saved-pass
    type: regex
    target:
      source: "file"
      path: "articles/sqlite-wal/gates/G0-brief.r1.md"
    pattern: "^## G0 brief gate: PASS \\(0 blocking"
  - name: asked-nothing
    type: tool_used
    tool: "AskUserQuestion"
    min: 0
    max: 0
