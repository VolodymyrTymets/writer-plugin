schema_version: "1.1"
name: g0-pass-css-container-queries
description: "The css-container-queries brief is complete, so G0 passes it"
tags: [gate, g0, pass]
runs: 1
execution:
  prompt: "/writer-plugin:check-brief css-container-queries"
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: verdict-line
    type: regex
    pattern: "^## G0 brief gate: PASS \\(0 blocking"
  - name: forked-write-free
    type: regex
    target: "trace"
    pattern: "\"subagent_type\"\\s*:\\s*\"writer-plugin:gate\""
