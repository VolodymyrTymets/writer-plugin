schema_version: "1.1"
name: g4-pass
description: "The final matches its sources, its recorded lint is clean and its links are allowed, so G4 passes"
tags: [gate, g4, pass]
runs: 1
execution:
  prompt: "/writer-plugin:check-final http-caching"
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: verdict-line
    type: regex
    pattern: "^## G4 final gate: PASS \\(0 blocking"
  - name: forked-write-free
    type: regex
    target: "trace"
    pattern: "\"subagent_type\"\\s*:\\s*\"writer-plugin:fact-gate\""
