schema_version: "1.1"
name: g2-block-marker-without-gap
description: "The research lists no open gap and the outline holds one marker, so G2 blocks on FACT-1 (the count-over-zero case)"
tags: [gate, g2, block]
runs: 1
execution:
  prompt: "/writer-plugin:check-outline http-caching"
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: verdict-line
    type: regex
    pattern: "^## G2 outline gate: BLOCK \\([1-9]"
  - name: forked-write-free
    type: regex
    target: "trace"
    pattern: "\"subagent_type\"\\s*:\\s*\"writer-plugin:gate\""
  - name: rule-id
    type: regex
    pattern: "\\[FACT-1\\]"
  - name: names-the-defect
    type: llm
    criteria: "The verdict blocks because the outline holds a marker (about a CDN default lifetime) while the research lists no open gap."
