schema_version: "1.1"
name: g2-pass-markers-per-gap
description: "Two open gaps, two markers, one per gap: G2 passes"
tags: [gate, g2, pass]
runs: 1
execution:
  prompt: "/writer-plugin:check-outline http-caching"
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: verdict-line
    type: regex
    pattern: "^## G2 outline gate: PASS \\(0 blocking"
  - name: forked-write-free
    type: regex
    target: "trace"
    pattern: "\"subagent_type\"\\s*:\\s*\"writer-plugin:gate\""
