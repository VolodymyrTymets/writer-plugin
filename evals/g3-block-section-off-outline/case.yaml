schema_version: "1.1"
name: g3-block-section-off-outline
description: "A section the outline does not plan, about CDN choice the brief says to avoid, so G3 blocks"
tags: [gate, g3, block]
runs: 1
execution:
  prompt: "/writer-plugin:check-draft http-caching"
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: verdict-line
    type: regex
    pattern: "^## G3 draft gate: BLOCK \\([1-9]"
  - name: forked-write-free
    type: regex
    target: "trace"
    pattern: "\"subagent_type\"\\s*:\\s*\"writer-plugin:gate\""
  - name: rule-id
    type: regex
    pattern: "\\[(STR-2|BRF-5)\\]"
  - name: names-the-defect
    type: llm
    criteria: "The verdict blocks the added \"Which CDN caches best\" section because the outline does not plan it and the brief says to avoid CDN vendor comparisons."
