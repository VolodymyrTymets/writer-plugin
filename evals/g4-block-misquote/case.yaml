schema_version: "1.1"
name: g4-block-misquote
description: "The final's quote of F1 says \"equal to\" where the source and the bank say \"greater than\", so G4 blocks on FACT-3"
tags: [gate, g4, block]
runs: 1
execution:
  prompt: "/writer-plugin:check-final http-caching"
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: verdict-line
    type: regex
    pattern: "^## G4 final gate: BLOCK \\([1-9]"
  - name: forked-write-free
    type: regex
    target: "trace"
    pattern: "\"subagent_type\"\\s*:\\s*\"writer-plugin:fact-gate\""
  - name: rule-id
    type: regex
    pattern: "\\[FACT-3\\]"
  - name: names-the-defect
    type: llm
    criteria: "The verdict blocks the quoted max-age sentence because it says \"equal to\" while the RFC and the bank row say \"greater than\"."
