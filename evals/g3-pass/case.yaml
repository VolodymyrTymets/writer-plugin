schema_version: "1.1"
name: g3-pass
description: "The draft follows the approved outline section by section, so G3 passes"
tags: [gate, g3, pass]
runs: 1
execution:
  prompt: "/writer-plugin:check-draft http-caching"
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill]
context:
  scaffold_script: scaffold.sh
graders:
  - name: verdict-line
    type: regex
    pattern: "^## G3 draft gate: PASS \\(0 blocking"
  - name: forked-write-free
    type: regex
    target: "trace"
    pattern: "\"subagent_type\"\\s*:\\s*\"writer-plugin:gate\""
